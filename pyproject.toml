[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-synthetic-pipeline"
version = "0.1.0"
description = "Synthetic Q&A dataset pipeline for the Código de Trabajo de Costa Rica."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "trafilatura>=1.12",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["dagster_pipeline*"]
exclude = ["dagster_pipeline_tests*"]

[tool.dagster]
module_name = "dagster_pipeline"
code_location_name = "legal_pipeline"

[tool.pytest.ini_options]
testpaths = ["dagster_pipeline_tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
